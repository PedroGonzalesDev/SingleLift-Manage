<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ao Vivo - PowerManager</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* Fundo escuro para a TV */
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 20px 30px; text-align: center; }
        .logo { color: #f8fafc; font-size: 1.8rem; }
        
        main { padding: 40px; max-width: 1000px; margin: 0 auto; }

        /* Estilos do Ranking para o Dark Mode */
        .ranking-container { margin-bottom: 60px; }
        .ranking-title { text-align: center; color: #60a5fa; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 40px; font-size: 2rem;}
        .cat-result-box { background: #1e293b; margin-bottom: 25px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .cat-result-header { background: #020617; color: white; padding: 15px 25px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; }
        table { width: 100%; border-collapse: collapse; }
        td { padding: 18px 25px; border-bottom: 1px solid #334155; color: #cbd5e1; font-size: 1.2rem; }
        tr:last-child td { border-bottom: none; }

        /* --- LUZES DE ARBITRAGEM (REFEREE LIGHTS) --- */
        .lights-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .lights-overlay.show { opacity: 1; pointer-events: auto; }
        .lights-name { font-size: 5rem; color: white; text-transform: uppercase; margin-bottom: 50px; text-align: center; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .lights-row { display: flex; gap: 40px; margin-bottom: 50px; }
        
        .light {
            width: 180px; height: 180px; border-radius: 50%;
            background: #334155; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            transition: all 0.4s ease;
        }
        
        .lights-overlay.valid .light { background: #ffffff; box-shadow: 0 0 80px rgba(255,255,255,0.9); }
        .lights-overlay.valid .lights-result { color: #ffffff; text-shadow: 0 0 30px rgba(255,255,255,0.5); }
        
        .lights-overlay.invalid .light { background: #ef4444; box-shadow: 0 0 80px rgba(239,68,68,0.9); }
        .lights-overlay.invalid .lights-result { color: #ef4444; text-shadow: 0 0 30px rgba(239,68,68,0.5); }
        
        .lights-result { font-size: 6rem; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="lights-overlay" class="lights-overlay">
        <h1 id="lights-name" class="lights-name">ATLETA</h1>
        <div class="lights-row">
            <div class="light"></div>
            <div class="light"></div>
            <div class="light"></div>
        </div>
        <h2 id="lights-result" class="lights-result">VÁLIDO</h2>
    </div>

    <header>
        <div class="logo">🔴 RANKING AO VIVO</div>
    </header>

    <main>
        <div id="results-display"></div>
    </main>

    <script src="live.js"></script>
</body>
</html>
